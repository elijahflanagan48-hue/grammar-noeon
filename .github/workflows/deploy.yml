name: Deploy to Cloudflare

# Запускается вручную: GitHub → Actions → Deploy to Cloudflare → Run workflow.
# Нужен секрет репозитория CLOUDFLARE_API_TOKEN (шаблон «Edit Cloudflare Workers»).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: python3 -B scripts/build_cloudflare.py
      - run: npx wrangler deploy --config cloudflare/wrangler.jsonc --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
